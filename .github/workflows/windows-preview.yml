name: Build unsigned Windows source preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build separate unsigned source preview
        run: python build.py
      - name: Check compiled UI without loading models or production data
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'YOEAI-Source-Smoke'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $process = Start-Process -FilePath (Resolve-Path 'dist/YOEAI/YOEAI.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(45000)) { throw 'UI smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'UI smoke test failed' }
          $report = Get-Content (Join-Path $env:LOCALAPPDATA 'AlsehliAI-Preview/text-image-shell-test.json') -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS') { throw 'UI smoke test did not report PASS' }

name: Check Windows source and UI contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check release source and portable contracts
        run: |
          python tools/check_release.py
          python tools/test_portable.py
          python tools/check_docs.py
      - name: Check Lite 3.0 source contracts without loading models
        working-directory: editions/lite/source
        run: |
          python tests_system/test_presets.py
          python tests_system/test_loading.py
          python tests_system/test_audit.py
          python tests_models/test_library.py
          node tests_visuals/data.cjs
          python tests_visuals/browser.py
          node tests_search/citations.cjs
          node tests_search/link_navigation.cjs
          node test_chat_controls.cjs ui.html
      # The unified compiled app/installer checks run in installer-candidates.yml.

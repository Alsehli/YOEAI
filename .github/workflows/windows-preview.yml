name: Build unsigned Windows source preview
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check release source and portable contracts
        run: |
          python tools/check_release.py
          python tools/test_portable.py
          python tools/check_docs.py
      - name: Check Lite 3.0 source contracts without loading models
        working-directory: editions/lite/source
        run: |
          python tests_system/test_presets.py
          python tests_system/test_loading.py
          python tests_system/test_audit.py
          python tests_models/test_library.py
          node tests_visuals/data.cjs
          python tests_visuals/browser.py
          node tests_search/citations.cjs
          node tests_search/link_navigation.cjs
          node test_chat_controls.cjs ui.html
      - name: Build separate unsigned source preview
        run: python build.py
      - name: Check compiled UI without loading models or production data
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'YOEAI-Source-Smoke'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $process = Start-Process -FilePath (Resolve-Path 'dist/YOEAI/YOEAI.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(45000)) { throw 'UI smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'UI smoke test failed' }
          $report = Get-Content (Join-Path $env:LOCALAPPDATA 'AlsehliAI-Preview/text-image-shell-test.json') -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS') { throw 'UI smoke test did not report PASS' }
